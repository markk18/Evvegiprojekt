<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ízletes Világ</title>
    
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style link rel="stylesheet" href="style.css"></style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-[#E8EFE9] selection:text-[#2C2A29]">

    <!-- FEJLÉC -->
    <header class="w-full bg-[#F9F6F0] border-b border-[#EBE6DE] sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="#" class="font-serif text-2xl sm:text-3xl font-bold tracking-tight text-[#2C2A29]">
                Ízletes Világ
            </a>
            <nav class="hidden md:flex items-center space-x-8 font-medium text-sm">
                <a href="#" class="bg-[#EFECE6] px-4 py-2 rounded-full text-[#2C2A29] shadow-sm">Receptek</a>
                <a href="#" class="hover:text-stone-600 transition">Kategóriák</a>
                <a href="#" class="hover:text-stone-600 transition">GasztroBlog</a>
                <a href="#" class="hover:text-stone-600 transition">Mentettek</a>
                <a href="#" class="flex items-center gap-2 hover:text-stone-600 transition">
                    <i class="fa-regular fa-user"></i> Profile
                </a>
            </nav>
        </div>
    </header>

    <!-- FŐ TARTALOM (Üres váz, a JS tölti fel!) -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full space-y-8">

        <!-- Kereső és szűrők -->
        <section class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4">
            <div class="relative flex-grow max-w-2xl">
                <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-stone-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="searchInput" placeholder="Keress receptet..." class="w-full pl-12 pr-4 py-3.5 bg-white rounded-full border border-stone-200 text-stone-800 focus:outline-none focus:ring-2 focus:ring-stone-400 shadow-sm">
            </div>
            <div class="flex items-center gap-3">
                <button onclick="filterBy('népszerű')" class="bg-white hover:bg-stone-50 border border-stone-200 px-5 py-3 rounded-full text-sm font-medium shadow-sm transition">
                    <i class="fa-solid fa-fire text-amber-500 mr-1.5"></i> népszerű
                </button>
                <button onclick="filterBy('vegán')" class="bg-white hover:bg-stone-50 border border-stone-200 px-5 py-3 rounded-full text-sm font-medium shadow-sm transition">
                    <i class="fa-solid fa-seedling text-emerald-600 mr-1.5"></i> vegán
                </button>
                <button onclick="filterBy('összes')" class="bg-[#2C2A29] text-white px-5 py-3 rounded-full text-sm font-medium shadow-sm transition">
                    összes
                </button>
            </div>
        </section>

        <!-- Kiemelt Banner helye -->
        <div id="heroContainer"></div>

        <!-- Fő oszlopok -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Bal 2 oszlop: Receptek listája -->
            <div class="lg:col-span-2 space-y-6">
                <h2 class="font-serif text-2xl font-bold text-[#2C2A29]">Legutóbbi receptek</h2>
                <div id="recipeGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
            </div>

            <!-- Jobb 1 oszlop: Kategóriák és Hírek -->
            <div class="space-y-6">
                <!-- Kategóriák widget -->
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-stone-100 space-y-4">
                    <h3 class="font-serif text-xl font-bold text-[#2C2A29]">Népszerű Kategóriák</h3>
                    <div id="categoryContainer" class="space-y-3"></div>
                </div>

                <!-- Hírek widget -->
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-stone-100 space-y-4">
                    <h3 class="font-serif text-xl font-bold text-[#2C2A29]">Aktuális Hírek</h3>
                    <div id="newsContainer" class="space-y-4"></div>
                </div>
            </div>
        </div>

    </main>

    <!-- LÁBLÉC -->
    <footer class="w-full bg-[#F7F4EE] border-t border-[#EBE6DE] py-6 mt-12 text-center text-xs text-stone-500">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <p>Copyright © 2026 Ízletes Világ</p>
            <div class="flex items-center gap-6">
                <a href="#" class="hover:text-stone-800">Rólunk</a>
                <a href="#" class="hover:text-stone-800">Kapcsolat</a>
                <a href="#" class="hover:text-stone-800">Adatvédelem</a>
            </div>
        </div>
    </footer>

<script src="script.js"></script>
</body>
</html>
